name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Rebuild hash-verified test fixtures
        run: python scripts/setup_fixtures.py --with-public-data
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Browser script syntax
        run: |
          for file in pebbles/static/*.js webdemo/*.js; do
            node --check "$file"
          done
      - name: Build static browser demo
        run: python scripts/build_web_demo.py
      - name: Workflow navigation checks
        run: node tests/js/continuity.test.cjs
